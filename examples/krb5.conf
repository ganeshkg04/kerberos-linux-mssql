# /etc/krb5.conf — Kerberos client config for a Linux box
# that cannot use the AD DNS servers (separate network zone).
# Back up the original first: sudo cp /etc/krb5.conf /etc/krb5.conf.bak

[libdefaults]
  default_realm = CORP.LOCAL          # the AD DNS domain, uppercase
  dns_lookup_kdc = false              # KDCs are listed below, not looked up
  dns_lookup_realm = false
  rdns = false                        # don't reverse-resolve server IPs
  dns_canonicalize_hostname = false   # use hostnames exactly as given
  forwardable = true
  udp_preference_limit = 1            # force TCP (only TCP 88 may be open)

[realms]
  CORP.LOCAL = {
    # Only the domain controllers reachable on port 88 from this server
    kdc = 10.0.0.11
    kdc = 10.0.0.12
  }

[domain_realm]
  .corp.local = CORP.LOCAL
  corp.local = CORP.LOCAL
